name: Daily rental-license update

# Runs once a day: pulls the current Active/Expired rental licenses and the
# 9-3902 violations from the City's public Carto API, diffs them against the
# previous state, and appends only what changed to the public change logs.
#
# The 25MB working-state files (state.json / violations_state.json) are the
# differ's "scratch paper" -- needed to detect changes, but NOT committed, so the
# repo only ever grows by the small daily appends. State persists between runs
# via the GitHub Actions cache. If the cache is ever missing (e.g. long idle),
# the run simply re-baselines: every license is logged once as "initial" again,
# which is harmless and self-heals.

on:
  schedule:
    - cron: '15 8 * * *'   # 08:15 UTC daily
  workflow_dispatch: {}      # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore differ state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            violations_state.json
          key: phl-state-${{ github.run_id }}
          restore-keys: |
            phl-state-

      - name: Collect license changes
        env:
          REPO_DIR: .
        run: python scripts/collect.py

      - name: Collect violation changes
        env:
          REPO_DIR: .
        run: python scripts/collect_violations.py

      - name: Timestamp change logs (OpenTimestamps)
        # Anchors a SHA-256 of each change log into the Bitcoin blockchain via free
        # public calendar servers -- proving the data existed unaltered as of a
        # given block, independent of this repo, GitHub, or the maintainer. Only a
        # hash is sent, never the data. Best-effort: never fails the daily update
        # (|| true), since timestamping is additive, not a gate.
        continue-on-error: true
        run: |
          pip install --quiet opentimestamps-client || { echo "ots install failed; skipping"; exit 0; }
          # Upgrade existing proofs first: fill in the Bitcoin block for any proof
          # whose calendar commitment has since confirmed. This is what turns a
          # "pending" proof into a permanent Bitcoin-anchored one, so the proof we
          # committed on a previous run gets its block attestation baked in (and
          # preserved forever in that commit's git history) before we replace it.
          for p in changes.ndjson.ots violations_changes.ndjson.ots changes/*.ots; do
            [ -f "$p" ] && ots upgrade "$p" 2>/dev/null || true
          done
          # Re-stamp the current logs. CRITICAL: `ots stamp` refuses to overwrite an
          # existing .ots, so we MUST delete the old proof first -- otherwise a proof
          # made on day 1 stays frozen while the data file keeps changing, and the
          # committed proof no longer matches (or verifies against) the current data.
          # Deleting + re-stamping guarantees today's committed proof anchors exactly
          # today's committed data; past states keep their own confirmed proofs in
          # git history at their commits.
          CUR_PART="changes/$(date -u +%Y-%m).ndjson"
          for f in changes.ndjson violations_changes.ndjson "$CUR_PART"; do
            [ -f "$f" ] || continue
            rm -f "$f.ots" "$f.ots.bak"
            ots stamp "$f" 2>/dev/null || true
          done
          echo "OTS stamping complete (best-effort)."

      - name: Commit and push changes
        run: |
          git config user.name  "phl-license-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A so proof files we deleted-then-re-stamped (including any stale
          # *.ots.bak the upgrade step left behind) are staged as add/modify/delete
          # correctly, not silently skipped.
          git add -A changes/ changes.ndjson changes.ndjson.ots violations_changes.ndjson violations_changes.ndjson.ots latest.json violations_latest.json
          if git diff --cached --quiet; then
            echo "Nothing staged today."
          else
            N=$(python -c "import json;print(json.load(open('latest.json')).get('changes_this_run',0))")
            # Distinguish a real data day from a timestamp-only day so the public
            # log stays honest: on a 0-change day the only new content is the daily
            # OpenTimestamps proof.
            if [ "$N" = "0" ]; then
              MSG="Daily timestamp $(date -u +%Y-%m-%d) (0 data changes; OTS proof only)"
            else
              MSG="Daily update $(date -u +%Y-%m-%d): ${N} change(s)"
            fi
            git commit -m "$MSG"
            git push
          fi

      - name: Save differ state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            violations_state.json
          key: phl-state-${{ github.run_id }}
